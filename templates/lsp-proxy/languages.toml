[language-server]
kotlin-lsp = { command = "kotlin-lsp", args = ["--stdio"] }
beancount-language-server = { command = "beancount-language-server", config = { journal_file = "ledger/ledger.beancount", bean_check = { method = "system", bean_check_cmd = "bean-check" } } }
ansible-language-server = { command = "ansible-language-server" }

[[language]]
name = "kotlin"
language-id = "kotlin"
file-types = ["kt", "kts"]
roots = ["gradlew", "build.gradle.kts", "build.gradle"]
language-servers = ["kotlin-lsp"]

[[language]]
name = "beancount"
file-types = [
  "beancount",
  "bean",
  { glob = "*.beancount.gpg" },
  { glob = "*.bean.gpg" },
  { glob = "*.beancount.asc" },
  { glob = "*.bean.asc" },
]
language-servers = ["beancount-language-server"]

[[language]]
name = "ansible"
file-types = [
  { glob = "playbook.ya?ml" },
  { glob = "roles/*.ya?ml" },
  { glob = "*vars/*.ya?ml" },
]
roots = ["ansible.cfg"]
language-servers = ["ansible-language-server"]
